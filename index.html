<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0ffer4ik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="card">
        <h1 id="secret-trigger">Hola!</h1>
        
        <div class="terminal">
            <div id="terminal-output"></div>
        </div>

        <img src="meme.jpg" alt="Смешной мем" class="meme-img" id="main-meme">

        <div class="social-links">
            <a href="https://vk.com/djxdtv" class="btn btn-social" target="_blank">VK</a>
            <a href="https://instagram.com/0ffer4ik" class="btn btn-social" target="_blank">Inst</a>
            <a href="https://threads.net/@0ffer4ik" class="btn btn-social" target="_blank">Threads</a>
            <a href="https://t.me/Offer4ik" class="btn btn-social" target="_blank">TG</a>
        </div>
    </div>

    <div id="secret-modal" class="secret-modal">
        <div class="secret-content">
            <span class="close-btn" id="close-secret">&times;</span>
            <img src="secret.jpg" alt="Секрет" class="secret-img">
        </div>
    </div>

    <script src="matrix.js"></script>
    
    <script>
        const meme = document.getElementById('main-meme');
        
        meme.addEventListener('mousemove', (e) => {
            const rect = meme.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;
            const rotateX = ((y - centerY) / centerY) * -15;
            const rotateY = ((x - centerX) / centerX) * 15;
            meme.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.05, 1.05, 1.05)`;
        });
        
        meme.addEventListener('mouseleave', () => {
            meme.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
        });

        let clickCount = 0;
        const trigger = document.getElementById('secret-trigger');
        const modal = document.getElementById('secret-modal');
        const closeBtn = document.getElementById('close-secret');

        trigger.addEventListener('click', () => {
            clickCount++;
            if (clickCount === 5) {
                modal.classList.add('show');
                clickCount = 0;
            }
        });

        closeBtn.addEventListener('click', () => modal.classList.remove('show'));
        window.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });

        const terminalOutput = document.getElementById('terminal-output');
        const lines = [
            "system_init() ... OK",
            "bypass_firewall() ... OK",
            "access_granted()",
            "it's my first site from GitHub Pages.",
            "but no😎"
        ];
        let lineIndex = 0;
        let charIndex = 0;
        let currentText = "";

        function typeTerminal() {
            if (lineIndex < lines.length) {
                if (charIndex < lines[lineIndex].length) {
                    currentText += lines[lineIndex].charAt(charIndex);
                    terminalOutput.innerHTML = currentText + '<span class="cursor">_</span>';
                    charIndex++;
                    setTimeout(typeTerminal, 50);
                } else {
                    currentText += "<br>";
                    lineIndex++;
                    charIndex = 0;
                    setTimeout(typeTerminal, 400);
                }
            } else {
                terminalOutput.innerHTML = currentText + '<span class="cursor">_</span>';
            }
        }

        window.onload = () => {
            setTimeout(typeTerminal, 500);
        };
    </script>
</body>
</html>
