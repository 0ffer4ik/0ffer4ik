<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Судоку 9х9</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card sudoku-card">
        <h1>Судоку</h1>
        
        <!-- Кнопки сложности -->
        <div class="difficulty-buttons">
            <button onclick="startGame('easy')" class="btn btn-easy">Легко</button>
            <button onclick="startGame('medium')" class="btn btn-medium">Средне</button>
            <button onclick="startGame('hard')" class="btn btn-hard">Сложно</button>
        </div>

        <!-- СЧЕТЧИК -->
        <div class="stats-panel">
            <div class="stat-item">Осталось: <span id="stat-remain">0</span></div>
            <div class="stat-item">Верно: <span id="stat-correct" style="color: #4CAF50;">0</span></div>
            <div class="stat-item">Ошибки: <span id="stat-wrong" style="color: #ff4d4d;">0</span></div>
            <!-- НОВАЯ СТРОКА ДЛЯ ТАЙМЕРА -->
            <div class="stat-item">Время: <span id="timer">00:00</span></div>
        </div>

        <!-- Сетка 9х9 -->
        <div id="sudoku-board" class="sudoku-board"></div>

        <p id="message" class="sudoku-message"></p>

        <!-- Кнопки действий -->
        <div class="sudoku-actions">
            <button onclick="checkSolution()" class="btn btn-primary">Проверить</button>
            <a href="index.html" class="btn btn-back">На главную</a>
        </div>
    </div>
    <script src="sudoku.js"></script>
</body>
</html>
