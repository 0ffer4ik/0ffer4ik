<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Судоку</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sudoku.css?v=4">
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <a href="index.html" class="back-btn">← Назад</a>

    <div class="card sudoku-card">
        <h1>Судоку</h1>
        
        <div class="stats-panel">
            <div class="stat-item">Время: <span id="timer">00:00</span></div>
            <div class="stat-item">Осталось: <span id="stat-remain">0</span></div>
            <div class="stat-item stat-correct">Верно: <span id="stat-correct">0</span></div>
            <div class="stat-item stat-wrong">Ошибки: <span id="stat-wrong">0</span></div>
        </div>

        <div class="difficulty-buttons">
            <button onclick="startGame('easy')" class="btn-diff">Легко</button>
            <button onclick="startGame('medium')" class="btn-diff">Средне</button>
            <button onclick="startGame('hard')" class="btn-diff">Сложно</button>
        </div>

        <section class="account-panel" aria-labelledby="account-title">
            <div class="account-heading">
                <h2 id="account-title">Аккаунт и рейтинг</h2>
                <span id="auth-status" class="auth-status">Подключаемся…</span>
            </div>
            <form id="auth-form" class="auth-form">
                <label class="auth-signup-only">Никнейм
                    <input id="auth-username" name="username" autocomplete="nickname" minlength="3" maxlength="20" placeholder="Например, Offer4ik">
                </label>
                <label>Email
                    <input id="auth-email" name="email" type="email" autocomplete="email" required>
                </label>
                <label>Пароль
                    <input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="8" required>
                </label>
                <div class="auth-actions">
                    <button class="btn-action" type="submit" data-auth-action="sign-in">Войти</button>
                    <button class="btn-action" type="button" id="sign-up-button">Создать аккаунт</button>
                    <button class="btn-action" type="button" id="sign-out-button" hidden>Выйти</button>
                </div>
            </form>
            <p id="auth-message" class="auth-message" role="status" aria-live="polite"></p>
        </section>

        <div id="sudoku-board" class="sudoku-board"></div>

        <div class="numpad" id="numpad">
            <button data-n="1" onclick="inputNumber(1)">1<small></small></button>
            <button data-n="2" onclick="inputNumber(2)">2<small></small></button>
            <button data-n="3" onclick="inputNumber(3)">3<small></small></button>
            <button data-n="4" onclick="inputNumber(4)">4<small></small></button>
            <button data-n="5" onclick="inputNumber(5)">5<small></small></button>
            <button data-n="6" onclick="inputNumber(6)">6<small></small></button>
            <button data-n="7" onclick="inputNumber(7)">7<small></small></button>
            <button data-n="8" onclick="inputNumber(8)">8<small></small></button>
            <button data-n="9" onclick="inputNumber(9)">9<small></small></button>
            <button onclick="inputNumber(0)" class="erase-btn">⌫</button>
        </div>

        <div class="action-buttons">
            <button onclick="giveHint()" class="btn-action">💡 Подсказка</button>
            <button onclick="checkSolution()" class="btn-action">Проверить</button>
            <button onclick="solveGame()" class="btn-action solve-button">🤖 Показать ответ</button>
        </div>
        
        <p id="message" class="sudoku-message"></p>

        <section class="leaderboard-panel" aria-labelledby="leaderboard-title">
            <div class="leaderboard-heading">
                <h2 id="leaderboard-title">Лучшие результаты</h2>
                <label class="leaderboard-filter">Сложность
                    <select id="leaderboard-difficulty">
                        <option value="easy">Легко</option>
                        <option value="medium">Средне</option>
                        <option value="hard">Сложно</option>
                    </select>
                </label>
            </div>
            <div class="leaderboard-scroll">
                <table class="leaderboard">
                    <thead><tr><th>#</th><th>Игрок</th><th>Лучшее время</th><th>Решено</th></tr></thead>
                    <tbody id="leaderboard-body"><tr><td colspan="4">Загрузка рейтинга…</td></tr></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="matrix.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="sudoku-auth.js"></script>
    <script src="sudoku-core.js"></script>
    <script src="sudoku.js"></script>
</body>
</html>
